name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Hutch
        uses: ./.github/actions/install-hutch
        with:
          channel: production

      - name: Install package dependencies
        working-directory: package
        run: hutch run install

      - name: Prepare vendored toolchains and devkit
        working-directory: package
        run: hutch build:dev

      - name: Run complete release checks
        working-directory: package
        run: hutch check:release

      - name: Test and inspect scoped npm bootstrap
        working-directory: npm/electrobun
        run: |
          node --test test/bootstrap.test.mjs test/package.test.mjs ../scripts/accept-published-bootstrap.test.mjs ../scripts/check-published-bootstrap.test.mjs
          npm pack --dry-run --ignore-scripts
